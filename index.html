<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: .25rem 0 0; }
    .output { margin-top: 1rem; }
    .notice { color: #8a4b00; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <div id="output" class="output" aria-live="polite">
    <p id="notice" class="notice" hidden></p>
    <div id="ready-box" hidden>
      <p><strong>Тема:</strong> <span id="topic"></span></p>
      <p><strong>Черновик ответа:</strong></p>
      <pre id="draft"></pre>
    </div>
  </div>

  <script type="module">
    const form = document.querySelector("form");
    const messageInput = document.querySelector("#message");
    const notice = document.querySelector("#notice");
    const readyBox = document.querySelector("#ready-box");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");

    function clearDraft() {
      topicEl.textContent = "";
      draftEl.textContent = "";
      readyBox.hidden = true;
    }

    function showNotice(text) {
      notice.textContent = text;
      notice.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      notice.hidden = true;

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: messageInput.value }),
        });

        const data = await reply.json();

        if (reply.status === 400 || data.status === "invalid_input") {
          clearDraft();
          showNotice("Введите непустой текст заявки.");
          return;
        }

        if (data.status === "manual_review") {
          clearDraft();
          showNotice("Не удалось автоматически подготовить ответ. Передайте заявку менеджеру для ручной обработки.");
          return;
        }

        if (data.status === "ready") {
          topicEl.textContent = data.topic;
          draftEl.textContent = data.draft;
          readyBox.hidden = false;
          return;
        }

        clearDraft();
        showNotice("Произошла ошибка при обработке заявки.");
      } catch {
        clearDraft();
        showNotice("Не удалось связаться с сервером.");
      }
    });
  </script>
</body>
</html>
